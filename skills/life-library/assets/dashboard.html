<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生库 · 留下成长的证据</title>
<style>
:root{color-scheme:light;--paper:#f4f1e9;--ink:#263d33;--muted:#657269;--line:#cbd0c3;--accent:#9c492e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 'Microsoft YaHei',sans-serif}main{max-width:1240px;margin:auto;padding:46px 42px}header{border-top:5px solid var(--ink);padding-top:16px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted)}h1{font:58px/1.2 'STSong','SimSun',serif;margin:32px 0 16px}h2{font:28px 'STSong','SimSun',serif;margin:0 0 22px}h3{font-size:18px;margin:0 0 10px}p{margin:8px 0}.intro{max-width:650px;color:var(--muted)}.meta{margin:28px 0;color:var(--accent)}nav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:15px 0;flex-wrap:wrap}button,input{font:inherit}button{border:1px solid var(--line);padding:9px 18px;background:transparent;color:var(--ink);cursor:pointer}button[aria-selected=true]{background:var(--ink);color:var(--paper)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.layout{display:grid;grid-template-columns:220px 1fr;gap:50px;padding-top:38px}aside{color:var(--muted);font-size:14px}aside strong{display:block;color:var(--ink);margin-bottom:14px}aside p{margin-bottom:20px}.panel[hidden]{display:none}article{border-top:1px solid var(--line);padding:23px 0}.date{font:13px monospace;color:var(--accent)}.tag{font-size:12px;border:1px solid var(--line);padding:2px 8px;margin-left:9px}.raw{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:14px}.empty{border:1px dashed var(--line);padding:35px;max-width:700px}.empty strong{display:block;margin-bottom:12px}.search{width:100%;padding:10px 12px;border:1px solid var(--line);background:#fff9;margin-bottom:22px;color:var(--ink)}.resume{background:#fffcf5;padding:35px;border:1px solid var(--line)}.bullet{padding:16px 0;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);margin-top:60px;padding:20px 0;color:var(--muted);font-size:12px}a{color:var(--accent)}@media(max-width:720px){main{padding:24px}h1{font-size:42px}.layout{grid-template-columns:1fr;gap:18px}aside{border-bottom:1px solid var(--line)}.resume{padding:20px}}@media print{header,nav,aside,footer,.panel:not(#resume){display:none!important}.layout{display:block}#resume{display:block!important}.resume{border:0;padding:0}.hint{display:none}}
</style>
<main><header><div class="eyebrow">LIFE LIBRARY / PERSONAL ARCHIVE</div><h1>经历会过去，<br>成长有迹可循。</h1><p class="intro">把做过的事、解决过的问题和留下的成果收好。需要介绍自己时，有事实可查，也有故事可讲。</p><div class="meta" id="profile"></div></header>
<nav aria-label="资料视图"><button data-tab="timeline" aria-selected="true">01 人生时间线</button><button data-tab="resume" aria-selected="false">02 当前简历</button><button data-tab="next" aria-selected="false">03 下一步</button></nav>
<div class="layout"><aside><strong>从一条记录开始</strong><p>在对话中说：<br>“记一条，今天……”<br>“给这条经历补证据”<br>“看看我的当前简历”<br>“我下一步可以做什么”</p><p id="stats"></p><p>此页包含个人记录，仅供本地查看。修改资料后，由 Skill 重新生成页面。</p></aside><section><div class="panel" id="timeline"><h2>人生时间线</h2><label class="hint" for="search">搜索经历、原话或标签</label><input class="search" id="search" type="search" placeholder="例如：竞赛、课程项目、实习"><div id="records"></div></div><div class="panel" id="resume" hidden><h2>当前简历</h2><div class="resume" id="resume-body"></div><p class="hint">此处为当前草稿。投递前可在对话中要求保存版本；保存不会自动投递。</p></div><div class="panel" id="next" hidden><h2>下一步</h2><div id="actions"></div><h2 style="margin-top:30px">岗位资料</h2><div id="jobs"></div></div></section></div><footer>原始记录 → 事实与证据 → 岗位表达 · 不以单一分数衡量成长</footer></main>
<script id="library-data" type="application/json">__LIBRARY_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('library-data').textContent);
if(data.demo){const banner=document.createElement('p');banner.textContent='虚构演示 · 姓名、经历和岗位均为示例，请勿作为真实材料投递';banner.style.cssText='background:#9c492e;color:white;padding:12px 20px;margin:0 0 20px';document.querySelector('header').prepend(banner);}
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const empty=(parent,title,body)=>{const n=el('div',undefined,'empty');n.append(el('strong',title),el('p',body));parent.append(n);};
const profile=data.profile;document.getElementById('profile').textContent=[profile.major||'专业待填写',profile.entry_year?`${profile.entry_year} 年入学`:'入学年份待填写',profile.intention||'方向尚未确定'].join(' / ');
document.getElementById('stats').textContent=`已保存 ${data.records.length} 条经历 · ${data.records.reduce((n,r)=>n+(r.evidence||[]).length,0)} 份证据`;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab);}));
function drawRecords(query=''){const box=document.getElementById('records');box.replaceChildren();const rows=data.records.filter(r=>[r.title,r.raw,...(r.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(b.occurred||'').localeCompare(a.occurred||''));if(!rows.length)empty(box,query?'没有找到匹配的记录':'你的第一条经历，值得留下。',query?'试试其他关键词。':'可以先记一个奖项、一次课程实验，或一个解决过的问题。日期和证据不完整，也可以先存下来。');rows.forEach(r=>{const n=el('article');const top=el('div',`${r.occurred||'发生时间待补'} · ${r.kind||'经历'}`,'date');top.append(el('span',r.usage==='resume'?'可用于简历':'仅个人回顾','tag'));n.append(top,el('h3',r.title),el('p',r.raw,'raw'));(r.facts||[]).forEach(f=>n.append(el('p',`${({reported:'用户陈述',verified:'已核实',uncertain:'待核实'})[f.status]} · ${f.text}`,'hint')));if(r.pending?.length)n.append(el('p','待补：'+r.pending.join('；'),'hint'));(r.evidence||[]).forEach(e=>{const a=el('a',e.original_name||'网络证据');a.href=e.path?e.path.split('/').map(encodeURIComponent).join('/'):e.url;a.target='_blank';a.rel='noopener noreferrer';const p=el('p');p.append(a);n.append(p);});box.append(n);});}
drawRecords();document.getElementById('search').addEventListener('input',e=>drawRecords(e.target.value));
const resume=document.getElementById('resume-body');resume.append(el('h3',profile.name||'姓名待填写'),el('p',data.resume.direction||'目标方向尚未确定'));if(data.resume.summary)resume.append(el('p',data.resume.summary));if(!data.resume.bullets.length)empty(resume,'简历从真实素材开始','还没有生成简历条目。在对话中指定可用于求职的经历和目标方向后，再生成草稿。');
const facts=new Map(data.records.flatMap(r=>(r.facts||[]).map(f=>[f.id,{r,f}])));data.resume.bullets.forEach(b=>{const n=el('div',undefined,'bullet');n.append(el('p',b.text));b.fact_ids.forEach(id=>{const s=facts.get(id);n.append(el('p',`来源：${s.r.title} · ${s.f.status==='verified'?'已核实':'用户陈述'} · ${id}`,'hint'));});resume.append(n);});
const actions=document.getElementById('actions');if(!data.actions.length)empty(actions,'先了解你，再讨论方向','填写专业、兴趣与当前阶段后，在对话中问“看看下一步”。此处不会默认给你安排一条职业道路。');data.actions.forEach(a=>{const n=el('article');n.append(el('h3',a.title));[['依据','basis'],['当前缺口','gap'],['行动','task'],['预计投入','effort'],['留下成果','deliverable'],['验收','acceptance'],['状态','status']].forEach(([label,key])=>{if(a[key])n.append(el('p',label+'：'+a[key]));});actions.append(n);});
const jobs=document.getElementById('jobs');if(!data.jobs.length)empty(jobs,'尚未收录岗位资料','提供岗位链接或招聘材料后保存来源和日期。历史招聘信息不会自动视为当前在招。');data.jobs.forEach(j=>{const n=el('article');n.append(el('h3',`${j.company} · ${j.title}`),el('p',`采集：${j.captured_at} · 核验：${j.verified_at||'未核验'} · 状态原文：${j.status||'未知'} · HC：${j.hc??'未公布'}`,'hint'));(j.requirements||[]).forEach(r=>n.append(el('p',r)));if(/^https?:\/\//.test(j.source_url||'')){const a=el('a','查看来源');a.href=j.source_url;a.target='_blank';a.rel='noopener noreferrer';n.append(a);}jobs.append(n);});
</script></html>
